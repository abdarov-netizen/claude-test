<title>Hubbyjon &amp; Honeypie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one night-sky stage; a single paper book page floats in its centre and turns like a real leaf.
   Deliberately one visual world (night + paper), so no light/dark split. */
:root{
  --night:#0b1029;        /* sky ground */
  --night-2:#18204a;      /* horizon glow */
  --gold:#d9b76e;         /* lattice, rules, star */
  --gold-soft:#d9b76e33;
  --paper:#f7f0e3;        /* book leaf */
  --paper-edge:#e9dcc4;
  --ink:#2a2233;          /* text on paper */
  --ink-soft:#6c6170;
  --clay:#b8714f;         /* pottery accent, used once at the end */
  --sage:#8fa38a;         /* cotton leaves */
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"EB Garamond", Georgia, "Times New Roman", serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-arabic:"Amiri", "Traditional Arabic", "Scheherazade New", serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 110%, var(--night-2), var(--night) 60%);
  background-color:var(--night);
  color:var(--paper);
  font-family:var(--f-body);
  overflow:hidden;
}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.lattice{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.09}

/* ---------- Intro ---------- */
.intro{
  position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px;
  transition:opacity 1.2s ease, transform 1.2s ease;
}
.intro.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.arch{
  position:relative;width:min(340px, 86vw);padding:56px 28px 40px;
  border:1px solid var(--gold-soft);border-radius:999px 999px 18px 18px;
  display:grid;gap:14px;justify-items:center;
  background:linear-gradient(#0b102966, #0b1029aa);
  backdrop-filter:blur(2px);
}
.arch::before{content:"";position:absolute;inset:8px;border:1px solid #d9b76e1f;border-radius:999px 999px 12px 12px;pointer-events:none}
.eyebrow{font-family:var(--f-display);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.intro h1{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(30px, 8vw, 40px);line-height:1.1;margin:0;text-wrap:balance}
.intro p{margin:0;font-size:17px;line-height:1.5;color:#e9e1d2cc;text-wrap:balance}
.hint{font-family:var(--f-hand);font-size:22px;color:var(--gold);margin-top:6px}

.star-btn{
  position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;padding:0;background:none;cursor:pointer;
  border-radius:50%;z-index:3;
}
.star-btn svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #fff3c8) drop-shadow(0 0 22px #d9b76e99);animation:pulse 2.6s ease-in-out infinite}
.star-btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.star-btn.gone{opacity:0;pointer-events:none;transition:opacity .8s}
@keyframes pulse{0%,100%{transform:scale(.85) rotate(0deg)}50%{transform:scale(1.08) rotate(22.5deg)}}

/* ---------- Book ---------- */
.stage{
  position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 14px;gap:12px;
  opacity:0;pointer-events:none;transition:opacity 1.4s ease .4s;
}
.stage.on{opacity:1;pointer-events:auto}
.book{perspective:1800px;width:min(480px, 100%);height:100%;max-height:760px;display:grid;align-items:center}
.leaf{
  position:relative;height:100%;max-height:760px;overflow:hidden auto;
  background:
    radial-gradient(130% 90% at 0% 0%, #fffaf0 0%, transparent 55%),
    linear-gradient(90deg, #00000014 0, transparent 14px),
    var(--paper);
  color:var(--ink);border-radius:4px 14px 14px 4px;
  box-shadow:0 30px 60px -20px #000c, 0 0 0 1px var(--paper-edge), inset 0 0 40px #b08a5a14;
  transform-origin:left center;transform-style:preserve-3d;
  scrollbar-width:thin;
}
.leaf.out{animation:turnOut .55s ease-in forwards}
.leaf.in{animation:turnIn .6s ease-out}
.leaf.out-back{animation:turnOutBack .5s ease-in forwards}
.leaf.in-back{animation:turnInBack .55s ease-out}
@keyframes turnOut{to{transform:rotateY(-95deg);opacity:.4}}
@keyframes turnIn{from{transform:rotateY(25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes turnOutBack{to{transform:rotateY(30deg);opacity:0}}
@keyframes turnInBack{from{transform:rotateY(-95deg);opacity:.4}to{transform:none;opacity:1}}

.page{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:34px 30px 30px;position:relative}
.page > *{min-width:0}
.corner{position:absolute;width:64px;height:64px;opacity:.55;pointer-events:none}
.corner.tl{top:6px;left:6px}
.corner.br{bottom:6px;right:6px;transform:rotate(180deg)}

.chapter{font-family:var(--f-display);letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:#9a7a3f;text-align:center}
.page h2{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(30px, 7vw, 38px);line-height:1.1;margin:0;text-align:center;text-wrap:balance}
.rule{display:flex;align-items:center;gap:10px;color:#b8955a;justify-content:center}
.rule::before,.rule::after{content:"";height:1px;width:64px;background:currentColor;opacity:.5}
.page p{font-size:18px;line-height:1.6;margin:0;max-width:62ch}
.note{font-family:var(--f-hand);font-size:24px;line-height:1.25;color:#7b4f3a}

/* Photo frame: an arch, like a window in a courtyard */
.photo{
  align-self:center;width:min(300px, 88%);aspect-ratio:3/4;max-width:100%;
  border-radius:999px 999px 6px 6px;overflow:hidden;position:relative;
  border:6px solid #fffaf2;box-shadow:0 0 0 1px #c9a86a, 0 14px 28px -14px #3b2a1a88;
  background:repeating-linear-gradient(45deg, #efe3cd 0 10px, #f3e9d6 10px 20px);
  display:grid;place-items:center;
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{font-family:var(--f-hand);font-size:20px;color:#9a8466;text-align:center;padding:24px}
.photo.wide{aspect-ratio:4/3;border-radius:120px 120px 6px 6px;width:min(360px, 96%)}

/* Draft markers: visible only while the skeleton is being filled */
.todo{
  border:1.5px dashed #c79b5b;border-radius:10px;padding:12px 14px;background:#fff8ea;
  font-family:var(--f-body);font-style:italic;font-size:16px;line-height:1.45;color:#8a6a3c;
}
.todo b{font-style:normal;font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-size:11px;display:block;margin-bottom:4px}

/* Cover */
.cover{justify-content:center;text-align:center;align-items:center;gap:22px}
.bismillah{font-family:var(--f-arabic);font-size:28px;color:#8a6a3c;direction:rtl}
.names{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(40px, 11vw, 54px);line-height:1;margin:0}
.names .amp{display:block;font-size:.55em;color:#b8955a;margin:6px 0}
.date{font-family:var(--f-display);letter-spacing:.3em;font-size:13px;text-transform:uppercase;color:var(--ink-soft)}

/* Ayah */
.ayah{font-family:var(--f-arabic);direction:rtl;font-size:clamp(22px, 5.6vw, 27px);line-height:2;text-align:center;color:#3c2c22}
.ayah-en{font-style:italic;text-align:center;color:var(--ink-soft)}
.ref{text-align:center;font-family:var(--f-display);letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:#9a7a3f}

/* Numbers */
.stats{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px}
.stat{border:1px solid #d8c29a;border-radius:10px;padding:14px 12px;text-align:center;background:#fffaf1}
.stat .n{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:#4a3426}
.stat .l{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.3}

/* Pottery */
.wheel-wrap{display:grid;place-items:center;padding-top:8px}
.wheel-wrap svg{width:min(240px, 70%);height:auto}
.vase{transform-origin:120px 150px;animation:shape 4s ease-in-out infinite}
@keyframes shape{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9) scaleY(1.04)}}
.spin{animation:spin 1.2s linear infinite;transform-origin:120px 168px}
@keyframes spin{to{transform:translateX(-24px)}}
.reveal{font-family:var(--f-display);font-style:italic;font-size:26px;text-align:center;color:var(--clay);margin:0;text-wrap:balance}

/* Calendar */
.cal{border:1px solid #d8c29a;border-radius:12px;padding:12px;background:#fffaf1}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head strong{font-family:var(--f-display);font-size:22px;font-weight:600}
.cal-nav{border:1px solid #d8c29a;background:var(--paper);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:4px;text-align:center}
.dow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:50%;background:none;font-family:var(--f-body);font-size:17px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.day:hover:not(:disabled){background:#efe0c4}
.day:disabled{color:#c8bcae;cursor:default}
.day.sel{background:var(--clay);color:#fff8ef}
.day.anniv{box-shadow:inset 0 0 0 1.5px #c9a86a}
.cta{
  border:0;border-radius:999px;padding:14px 22px;font-family:var(--f-display);font-size:20px;font-weight:600;
  background:var(--clay);color:#fff8ef;cursor:pointer;align-self:center;box-shadow:0 10px 20px -10px #8a4a2c;
}
.cta:disabled{background:#d9c3b0;box-shadow:none;cursor:default}
.done{text-align:center;display:grid;gap:10px}
.done .big{font-family:var(--f-display);font-style:italic;font-size:30px;margin:0;color:#4a3426}

/* Controls under the book */
.controls{display:flex;align-items:center;gap:14px;width:min(480px, 100%);justify-content:space-between}
.nav-btn{
  border:1px solid var(--gold-soft);background:#0b102988;color:var(--gold);border-radius:999px;
  height:44px;min-width:44px;padding:0 16px;font-family:var(--f-display);font-size:17px;cursor:pointer;
}
.nav-btn:disabled{opacity:.25;cursor:default}
.nav-btn:focus-visible,.cta:focus-visible,.day:focus-visible,.cal-nav:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:#d9b76e44}
.dots i.on{background:var(--gold)}
.sound{
  position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top, 0px));right:max(12px, env(safe-area-inset-right, 0px));
  border:1px solid var(--gold-soft);background:#0b102988;color:var(--gold);border-radius:999px;height:36px;padding:0 14px;
  font-family:var(--f-display);font-size:15px;cursor:pointer;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<!-- Eight-point star lattice (khatam), drawn once and tiled -->
<svg class="lattice" aria-hidden="true">
  <defs>
    <pattern id="khatam" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d9b76e" stroke-width="1">
        <rect x="22" y="22" width="36" height="36"/>
        <rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
        <path d="M0 40 H14 M66 40 H80 M40 0 V14 M40 66 V80"/>
        <circle cx="0" cy="0" r="6"/><circle cx="80" cy="0" r="6"/><circle cx="0" cy="80" r="6"/><circle cx="80" cy="80" r="6"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#khatam)"/>
</svg>

<button class="sound" id="sound" hidden aria-pressed="false">♪ Sound off</button>

<section class="intro" id="intro">
  <div class="arch">
    <div class="eyebrow">19 · XI · 2024</div>
    <h1>Two years ago, this sky watched over us</h1>
    <p>Somewhere up there is the brightest star of that night.</p>
    <div class="hint">find it, Honeypie ✦</div>
  </div>
</section>

<button class="star-btn" id="star" aria-label="Open our book">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <g fill="#fff6d8">
      <rect x="20" y="20" width="24" height="24"/>
      <rect x="20" y="20" width="24" height="24" transform="rotate(45 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="6" fill="#ffffff"/>
  </svg>
</button>

<main class="stage" id="stage" aria-live="polite">
  <div class="book"><article class="leaf" id="leaf"></article></div>
  <nav class="controls" aria-label="Turn pages">
    <button class="nav-btn" id="prev" aria-label="Previous page">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="next" aria-label="Next page">›</button>
  </nav>
</main>

<script>
/* =========================================================
   CONTENT — everything to fill in lives here.
   photo: "" shows a placeholder; later becomes "photos/xyz.jpg"
   todo:  a dashed hint for Abdullah; delete once text is written
   ========================================================= */
const NIKAH = new Date(2024, 10, 19); // 19 Nov 2024

const CORNER = `<svg class="corner CLS" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#b8955a" stroke-width="1"><path d="M4 60 V4 H60"/><path d="M10 54 V10 H54" opacity=".6"/></g><g fill="#8fa38a"><ellipse cx="20" cy="18" rx="6" ry="2.6" transform="rotate(-35 20 18)"/></g><circle cx="15" cy="13" r="5" fill="#fffdf8" stroke="#e3d6bd"/><circle cx="19" cy="11" r="4" fill="#fffdf8" stroke="#e3d6bd"/><circle cx="13" cy="17" r="4" fill="#fffdf8" stroke="#e3d6bd"/></svg>`;
const corners = () => CORNER.replace("CLS","tl") + CORNER.replace("CLS","br");
const photo = (src, label, wide) => `<div class="photo${wide ? " wide" : ""}">${src ? `<img src="${src}" alt="${label}">` : `<div class="ph">photo<br>${label}</div>`}</div>`;
const todo = (title, text) => `<div class="todo"><b>✎ ${title}</b>${text}</div>`;

const daysTogether = () => Math.floor((Date.now() - NIKAH) / 86400000);

const PAGES = [
  // 0 — Cover
  () => `<div class="page cover">${corners()}
    <div class="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <h1 class="names">Hubbyjon<span class="amp">&amp;</span>Honeypie</h1>
    <div class="rule">✦</div>
    <div class="date">The cotton anniversary · two years</div>
    <p class="note">a little book about us, written by me</p>
  </div>`,

  // 1 — Ayah
  () => `<div class="page cover">${corners()}
    <p class="ayah">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p>
    <div class="rule">✦</div>
    <p class="ayah-en">“And of His signs is that He created for you from yourselves mates that you may find tranquillity in them; and He placed between you affection and mercy.”</p>
    <div class="ref">Ar-Rum · 30:21</div>
  </div>`,

  // 2 — Chapter I
  () => `<div class="page">${corners()}
    <div class="chapter">Chapter I</div>
    <h2>Before there was “us”</h2>
    <div class="rule">✦</div>
    ${todo("Your letter", "How did you first hear about Honeypie or see her? What did you think back then? One funny honest detail works great here.")}
    ${photo("", "how it all started")}
  </div>`,

  // 3 — Chapter II
  () => `<div class="page">${corners()}
    <div class="chapter">Chapter II</div>
    <h2>The first time we met</h2>
    <div class="rule">✦</div>
    ${photo("", "the first meeting", true)}
    ${todo("Your letter", "Where it was, what she wore or said, what you were nervous about. What did you think when you left?")}
  </div>`,

  // 4 — Funny interlude
  () => `<div class="page cover">${corners()}
    <div class="chapter">A short intermission</div>
    <h2>Things nobody knows about us</h2>
    <div class="rule">✦</div>
    ${todo("Inside joke", "An inside joke, nickname story, or ‘official facts’ list. For example: ‘Fact #1: Honeypie has never lost an argument. Hubbyjon is still checking.’")}
  </div>`,

  // 5 — Chapter III: Nikah
  () => `<div class="page">${corners()}
    <div class="chapter">Chapter III · 19 November 2024</div>
    <h2>The day of our nikah</h2>
    <div class="rule">✦</div>
    ${photo("", "the nikah")}
    ${todo("Your letter", "What you felt when the nikah was read. One moment from that day only you two remember.")}
  </div>`,

  // 6 — Chapter IV: Year one
  () => `<div class="page">${corners()}
    <div class="chapter">Chapter IV</div>
    <h2>Year one: learning each other</h2>
    <div class="rule">✦</div>
    ${photo("", "year one", true)}
    ${todo("Your letter", "First home, first trip, first time cooking together, first big argument and how you made up.")}
  </div>`,

  // 7 — Numbers
  () => `<div class="page">${corners()}
    <div class="chapter">Official statistics</div>
    <h2>Us, by the numbers</h2>
    <div class="rule">✦</div>
    <div class="stats">
      <div class="stat"><div class="n">${daysTogether()}</div><div class="l">days as husband &amp; wife</div></div>
      <div class="stat"><div class="n">${(daysTogether()*24).toLocaleString("en-US")}</div><div class="l">hours of me being lucky</div></div>
      <div class="stat"><div class="n">?</div><div class="l">cities together</div></div>
      <div class="stat"><div class="n">∞</div><div class="l">times you were right (I'm told)</div></div>
    </div>
    ${todo("Numbers", "Send me real ones: trips, messages, favourite food ordered, ‘what should we eat’ debates… I can count from your chat export.")}
  </div>`,

  // 8 — Chapter V: Year two
  () => `<div class="page">${corners()}
    <div class="chapter">Chapter V</div>
    <h2>Year two: building a home</h2>
    <div class="rule">✦</div>
    ${photo("", "year two")}
    ${todo("Your letter", "What changed in the second year. What you are proud of together.")}
  </div>`,

  // 9 — Chapter VI: Now
  () => `<div class="page">${corners()}
    <div class="chapter">Chapter VI</div>
    <h2>Now</h2>
    <div class="rule">✦</div>
    ${photo("", "us today", true)}
    ${todo("Your letter", "Who she is to you today. What you love in your everyday life together.")}
  </div>`,

  // 10 — Letter ending + dua
  () => `<div class="page">${corners()}
    <div class="chapter">Last pages</div>
    <h2>To my wife</h2>
    <div class="rule">✦</div>
    ${todo("Your letter, final part", "The warmest part. Your promise or dua for the years ahead. Finish with something that leads into the gift, e.g. ‘…and for our third year, I want us to make something with our own hands.’")}
    <p class="note" style="text-align:right">— your Hubbyjon</p>
  </div>`,

  // 11 — Gift reveal
  () => `<div class="page cover">${corners()}
    <div class="chapter">Your gift</div>
    <div class="wheel-wrap">
      <svg viewBox="0 0 240 200" aria-hidden="true">
        <defs><clipPath id="wc"><ellipse cx="120" cy="168" rx="88" ry="16"/></clipPath></defs>
        <ellipse cx="120" cy="176" rx="96" ry="18" fill="#3a2a22" opacity=".18"/>
        <ellipse cx="120" cy="168" rx="88" ry="16" fill="#cdb79a"/>
        <g clip-path="url(#wc)"><g class="spin" fill="#b89f80">
          ${Array.from({length:14},(_,i)=>`<rect x="${20+i*24}" y="150" width="8" height="40"/>`).join("")}
        </g></g>
        <g class="vase">
          <path d="M92 160 C 84 130, 104 118, 100 96 C 98 84, 106 78, 120 78 C 134 78, 142 84, 140 96 C 136 118, 156 130, 148 160 Z" fill="#b8714f"/>
          <path d="M104 86 C 110 82, 130 82, 136 86" stroke="#8f5338" stroke-width="2" fill="none"/>
          <path d="M100 120 C 112 126, 128 126, 140 120" stroke="#cf8a66" stroke-width="2" fill="none" opacity=".7"/>
        </g>
      </svg>
    </div>
    <h2>A pottery class, just the two of us</h2>
    <p class="reveal">Two years of building a life. Now let’s make something with our hands.</p>
    <p class="note">(yes, like that scene in the movie. no, I will not be serious the whole time)</p>
  </div>`,

  // 12 — Calendar
  () => `<div class="page">${corners()}
    <div class="chapter">One last thing</div>
    <h2>Pick our day</h2>
    <p style="text-align:center">Choose any day you like. I’ll take care of the rest.</p>
    <div class="cal" id="cal"></div>
    <button class="cta" id="book" disabled>Book our pottery day</button>
    <div class="done" id="done" hidden></div>
  </div>`,
];

/* ---------- Sky ---------- */
const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let stars = [], W = 0, H = 0, shoot = null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const n = Math.round(W*H/2600);
  stars = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H*0.95, r:Math.random()*1.3+.2, p:Math.random()*6.28, s:Math.random()*.02+.004, warm:Math.random()<.25}));
  placeStar();
}
function draw(t){
  cx.clearRect(0,0,W,H);
  for(const s of stars){
    const a = reduce ? .7 : .45 + .55*Math.sin(s.p + t*s.s*0.06);
    cx.globalAlpha = Math.max(.08, a);
    cx.fillStyle = s.warm ? "#ffe6b0" : "#e8ecff";
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  }
  if(!reduce){
    if(!shoot && Math.random() < .002) shoot = {x:Math.random()*W*.7, y:Math.random()*H*.35, life:0};
    if(shoot){
      shoot.life += 1; const L = shoot.life;
      const g = cx.createLinearGradient(shoot.x+L*7, shoot.y+L*3, shoot.x+L*7-90, shoot.y+L*3-38);
      g.addColorStop(0,"#fff8e0"); g.addColorStop(1,"#fff8e000");
      cx.globalAlpha = Math.max(0, 1 - L/50); cx.strokeStyle = g; cx.lineWidth = 1.4;
      cx.beginPath(); cx.moveTo(shoot.x+L*7, shoot.y+L*3); cx.lineTo(shoot.x+L*7-90, shoot.y+L*3-38); cx.stroke();
      if(L > 50) shoot = null;
    }
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
const starBtn = document.getElementById("star");
function placeStar(){
  // top-right of the sky, clear of the arch text
  starBtn.style.left = Math.round(W*0.76) + "px";
  starBtn.style.top = Math.round(Math.max(70, H*0.14)) + "px";
}
addEventListener("resize", resize); resize(); requestAnimationFrame(draw);

/* ---------- Ambient sound (generated, no file) ---------- */
let ac = null, master = null, soundOn = false;
function startAmbient(){
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    const verb = ac.createConvolver(); const len = ac.sampleRate*3.5, buf = ac.createBuffer(2, len, ac.sampleRate);
    for(let c=0;c<2;c++){ const d = buf.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
    verb.buffer = buf;
    const wet = ac.createGain(); wet.gain.value = .7;
    lp.connect(master); lp.connect(verb); verb.connect(wet); wet.connect(master); master.connect(ac.destination);
    // soft D major add9 pad, each voice breathing slowly
    [146.83, 220.0, 293.66, 329.63, 369.99, 440.0].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
      o.type = i % 2 ? "sine" : "triangle"; o.frequency.value = f; o.detune.value = (Math.random()-.5)*8;
      g.gain.value = .035; lfo.frequency.value = .04 + Math.random()*.06; lg.gain.value = .03;
      lfo.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(lp); o.start(); lfo.start();
    });
    master.gain.linearRampToValueAtTime(.55, ac.currentTime + 4);
    soundOn = true; syncSound();
  }catch(e){ soundOn = false; }
}
const soundBtn = document.getElementById("sound");
function syncSound(){ soundBtn.textContent = soundOn ? "♪ Sound on" : "♪ Sound off"; soundBtn.setAttribute("aria-pressed", soundOn); }
soundBtn.addEventListener("click", () => {
  if(!ac){ startAmbient(); return; }
  soundOn = !soundOn;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.linearRampToValueAtTime(soundOn ? .55 : 0, ac.currentTime + 1.2);
  if(soundOn) ac.resume(); syncSound();
});

/* ---------- Book ---------- */
const leaf = document.getElementById("leaf"), dots = document.getElementById("dots");
const prev = document.getElementById("prev"), next = document.getElementById("next");
let idx = 0, busy = false;
dots.innerHTML = PAGES.map(() => "<i></i>").join("");
function render(){
  leaf.innerHTML = PAGES[idx]();
  leaf.scrollTop = 0;
  [...dots.children].forEach((d,i) => d.classList.toggle("on", i === idx));
  prev.disabled = idx === 0; next.disabled = idx === PAGES.length - 1;
  if(idx === PAGES.length - 1) mountCalendar();
}
function go(dir){
  const to = idx + dir;
  if(busy || to < 0 || to >= PAGES.length) return;
  if(reduce){ idx = to; render(); return; }
  busy = true;
  leaf.className = "leaf " + (dir > 0 ? "out" : "out-back");
  setTimeout(() => {
    idx = to; render();
    leaf.className = "leaf " + (dir > 0 ? "in" : "in-back");
    setTimeout(() => { leaf.className = "leaf"; busy = false; }, 600);
  }, 500);
}
prev.addEventListener("click", () => go(-1));
next.addEventListener("click", () => go(1));
addEventListener("keydown", e => { if(e.key === "ArrowRight") go(1); if(e.key === "ArrowLeft") go(-1); });
let tx = null, ty = null;
leaf.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
leaf.addEventListener("touchend", e => {
  if(tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.4) go(dx < 0 ? 1 : -1);
  tx = null;
});

/* ---------- Open ---------- */
starBtn.addEventListener("click", () => {
  document.getElementById("intro").classList.add("gone");
  starBtn.classList.add("gone");
  document.getElementById("stage").classList.add("on");
  soundBtn.hidden = false;
  startAmbient();
  render();
});

/* ---------- Calendar ---------- */
let chosen = null;
try{ const s = localStorage.getItem("pottery-day"); if(s) chosen = new Date(s); }catch(e){}
function mountCalendar(){
  const box = document.getElementById("cal"); if(!box) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  let view = chosen ? new Date(chosen.getFullYear(), chosen.getMonth(), 1) : new Date(first);
  const fmt = d => d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  const bookBtn = document.getElementById("book"), done = document.getElementById("done");
  function paint(){
    const y = view.getFullYear(), m = view.getMonth();
    const startDow = (new Date(y, m, 1).getDay() + 6) % 7; // Monday first
    const nDays = new Date(y, m+1, 0).getDate();
    let html = `<div class="cal-head">
      <button class="cal-nav" id="cp" aria-label="Previous month" ${view <= first ? "disabled" : ""}>‹</button>
      <strong>${view.toLocaleDateString("en-GB",{month:"long", year:"numeric"})}</strong>
      <button class="cal-nav" id="cn" aria-label="Next month">›</button></div><div class="cal-grid">`;
    html += ["Mo","Tu","We","Th","Fr","Sa","Su"].map(d => `<div class="dow">${d}</div>`).join("");
    html += "<div></div>".repeat(startDow);
    for(let d=1; d<=nDays; d++){
      const date = new Date(y, m, d);
      const sel = chosen && +date === +chosen;
      const anniv = m === 10 && d === 19;
      html += `<button class="day${sel?" sel":""}${anniv?" anniv":""}" data-d="${d}" ${date <= today ? "disabled" : ""} aria-label="${fmt(date)}">${d}</button>`;
    }
    box.innerHTML = html + "</div>";
    box.querySelector("#cp").onclick = () => { view = new Date(y, m-1, 1); paint(); };
    box.querySelector("#cn").onclick = () => { view = new Date(y, m+1, 1); paint(); };
    box.querySelectorAll(".day:not(:disabled)").forEach(b => b.onclick = () => { chosen = new Date(y, m, +b.dataset.d); paint(); });
    bookBtn.disabled = !chosen;
  }
  bookBtn.onclick = () => {
    try{ localStorage.setItem("pottery-day", chosen.toISOString()); }catch(e){}
    box.hidden = true; bookBtn.hidden = true; done.hidden = false;
    done.innerHTML = `<p class="big">It’s a date 🤍</p>
      <p>${fmt(chosen)}</p>
      <p class="note">You, me, and a lump of clay. Happy anniversary, Honeypie.</p>
      <button class="nav-btn" id="change" style="justify-self:center;color:#8a6a3c;border-color:#d8c29a;background:none">Change the day</button>`;
    done.querySelector("#change").onclick = () => { box.hidden = false; bookBtn.hidden = false; done.hidden = true; paint(); };
  };
  paint();
}
</script>
